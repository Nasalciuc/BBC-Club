name: api-deploy
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/**", "package.json", "bun.lock", ".github/workflows/api-deploy.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs: { target: { description: "staging | production", required: true, default: "staging" } }

permissions: { contents: read, packages: write }
concurrency: { group: deploy-${{ github.ref }}, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: { image: "${{ steps.meta.outputs.image }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: |
          SHA=${GITHUB_SHA::7}
          echo "image=ghcr.io/nasalciuc/bbc-api:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/nasalciuc/bbc-api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /opt/bbc/infra/deploy.sh staging ${{ needs.build.outputs.image }}

  production:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: production            # protected: requires manual approval in GitHub → Environments
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bbc && git fetch -q && git checkout -q ${{ github.sha }}
            bash infra/deploy.sh production ${{ needs.build.outputs.image }}
