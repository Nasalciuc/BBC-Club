appId: com.buybusinessclass.club
---
# Android: AuthShell's footer stays under the open keyboard (edge-to-edge, no resize; follow-up in PR 43),
# so the keyboard is closed before a footer button. Remove once the footer docks above it (DESIGN.md).
- launchApp: { clearState: true }
- runFlow: _dismiss-system-dialogs.yaml
- tapOn: { id: "welcome.signIn" }
- tapOn: { id: "signIn.createAccount" }
- assertVisible: { id: "join.email" }
- tapOn: { id: "join.email" }
- inputText: "new.member@test.dev"
- hideKeyboard
- tapOn: { id: "join.continue" }
- assertVisible: { id: "verify.code" }
# Fetch OTP from the test helper — never log the code, never put it in the URL.
- runScript:
    file: scripts/last-otp.js
    env:
      EMAIL: new.member@test.dev
- assertTrue: ${output.otp != null && output.otp !== ''}
- tapOn: { id: "verify.code" }
- inputText: ${output.otp}
- hideKeyboard
- tapOn: { id: "verify.submit" }
- assertVisible: { id: "setPassword.password" }
- tapOn: { id: "setPassword.password" }
- inputText: "atlantic2026!"
- hideKeyboard
- tapOn: { id: "setPassword.continue" }
# New member has no homeAirport → onboarding once per device; skip leaves JFK via DEFAULT_HOME_AIRPORT.
- assertVisible: { id: "onboarding.root" }
- tapOn: { id: "onboarding.skip" }
# Unknown CRM email → waitlist status in DB; living profiles land on Explore after onboarding/skip.
- assertVisible: { id: "explore.root" }
