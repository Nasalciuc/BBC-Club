appId: com.buybusinessclass.club
---
- launchApp: { clearState: true }
- assertVisible: { id: "welcome.signIn" }
- tapOn: { id: "welcome.signIn" }
- assertVisible: { id: "signIn.email" }
- tapOn: { id: "signIn.email" }
- inputText: "alex.morgan@company.com"
- tapOn: { id: "signIn.password" }
- inputText: "atlantic2026!"
- tapOn: { id: "signIn.submit" }
- assertVisible: { id: "feed.root" }
- assertVisible: { id: "tabs.proposals" }
# Seeded offer → open first card → I'm interested (no secrets in params).
- extendedWaitUntil:
    visible: { id: "feed.card" }
    timeout: 15000
- tapOn: { id: "feed.card" }
- assertVisible: { id: "detail.root" }
- tapOn: { id: "detail.interested" }
- assertVisible: { id: "detail.done" }
