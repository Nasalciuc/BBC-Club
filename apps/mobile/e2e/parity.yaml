appId: com.buybusinessclass.club
---
# Screenshots at 392.7 dp (run-parity-ci.sh sets wm density 440). Names are Figma frame ids.
# Later stages of this PR append a takeScreenshot for each new frame. This file does not replace the four flows.
- launchApp: { clearState: true }
- runFlow: _dismiss-system-dialogs.yaml
- tapOn: { id: "welcome.signIn" }
- tapOn: { id: "signIn.email" }
- inputText: "alex.morgan@company.com"
- tapOn: { id: "signIn.password" }
- inputText: "atlantic2026!"
- hideKeyboard
- tapOn: { id: "signIn.submit" }
- assertVisible: { id: "explore.root" }
- takeScreenshot: 89-386
- tapOn: { id: "tab.profile" }
- assertVisible: { id: "profile.root" }
- takeScreenshot: 233-4453
- tapOn: { id: "profile.settings" }
- assertVisible: { id: "settings.root" }
- takeScreenshot: 479-8226
- tapOn: { id: "settings.back" }
- tapOn: { id: "profile.edit" }
- assertVisible: { id: "editProfile.root" }
- takeScreenshot: 479-8296
- tapOn: { id: "editProfile.back" }
- tapOn: { id: "tab.requests" }
- assertVisible: { id: "requests.root" }
- takeScreenshot: 233-4069
- tapOn: { id: "tab.explore" }
- assertVisible: { id: "explore.root" }
- tapOn: { id: "explore.search" }
- assertVisible: { id: "explore.airportQuery" }
- takeScreenshot: 104-838
# ADR-IMPL-041 — Home as Figma draws it: Cancel leaves typing, a pin opens the route with its preference chips.
- tapOn: { id: "explore.cancel" }
- hideKeyboard
- assertVisible: { id: "explore.search" }
- tapOn: { id: "globe.pin.LHR" }
- assertVisible: { id: "explore.chips" }
- assertVisible: { id: "explore.quote" }
- takeScreenshot: 89-387
- tapOn: { id: "explore.chip.dates" }
- assertVisible: { id: "dates.root" }
- takeScreenshot: 325-5878
- tapOn: { id: "dates.close" }
- tapOn: { id: "explore.profile" }
- assertVisible: { id: "profile.root" }
