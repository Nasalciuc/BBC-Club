# What VictoriaMetrics scrapes, every 30 s (ADR-IMPL-073). Each API replica is its own target: Compose answers one A
# record per replica for the service's name, so a replica that scales in or out is followed within a refresh. `env`
# tells production from staging on the same box; a target whose service is not running (staging detached) stays down
# in `up` and nothing else.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
    relabel_configs:
      - target_label: env
        replacement: production

  - job_name: api-staging
    dns_sd_configs:
      - names: [api-staging]
        type: A
        port: 8000
    relabel_configs:
      - target_label: env
        replacement: staging

  - job_name: worker
    static_configs:
      - targets: ["worker:8001"]
        labels: { env: production }

  - job_name: worker-staging
    static_configs:
      - targets: ["worker-staging:8001"]
        labels: { env: staging }

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Only the families the dashboards and alerts read: the rest of cAdvisor's would be series nobody looks at.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|spec_memory_limit_bytes|network_receive_bytes_total|network_transmit_bytes_total|oom_events_total)
        action: keep
