# Static part only. Everything environment-specific (S3 endpoint/bucket/keys, cipher pass) is passed as
# PGBACKREST_REPO1_* env vars from infra/env/production.env — pgbackrest does NOT interpolate ${VARS} here.
[global]
repo1-type=s3
repo1-path=/bbc
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full=7
repo1-retention-diff=14
process-max=2
log-level-console=info
log-level-file=detail
start-fast=y
compress-type=zst
delta=y

[bbc]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=bbc
