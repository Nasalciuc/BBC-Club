# ONE project, ONE compose file, overlays for prod/staging/test. Staging is extra services in this same
# project (api-staging, postgres-staging) so a single Caddy can hold certificates for both domains.
#
# Memory on the 8 GB box (limits, MB): production 3 840 (Caddy 128, 2 × API 512, worker 512, PgBouncer 64, Postgres
# 2 048, cron 64) + staging 2 048 + Uptime Kuma 128 + monitoring 736 (MONITORING=on: VictoriaMetrics 192, Grafana 384,
# node-exporter 32, cAdvisor 128) = 6 752, so the limits never add up past the RAM; a deploy runs twice the API replicas
# for a few minutes (+1 024): 7 776 (ADR-IMPL-073). Off unless asked for: MinIO 256 (MEDIA=on, with R1b), GlitchTip 1 664
# (GLITCHTIP=on) and Redis + Kafka 1 344 (REDIS_URL or KAFKA_BROKERS) — each needs that sum looked at again first.
# API_MEMORY, WORKER_MEMORY and POSTGRES_MEMORY move a limit without editing this file. Under pressure the kernel kills
# staging first (oom_score_adj 500) and Postgres last (-500).
name: bbc

x-logging: &logging
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
x-restart: &restart
  restart: unless-stopped

networks:
  edge: {} # caddy ↔ api
  data: { internal: true } # postgres, redis, minio, glitchtip, kuma, monitoring — no internet, no host

services:
  # ── the only door ─────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    <<: [*restart, *logging]
    ports: ["80:80", "443:443"]
    networks: [edge, data]
    volumes:
      # The directory, not single files: a file git replaces gets a new inode, which a single-file mount never sees,
      # so `caddy reload` (deploy.sh step 8) would keep reading the old Caddyfile.
      - ./caddy:/etc/caddy:ro
      - ./caddy/well-known:/srv/well-known:ro
      # The Cloudflare Origin CA certificate, outside git (RUNBOOK § Certificates). Read only with ORIGIN_TLS=on.
      - ${ORIGIN_CERT_DIR:-/etc/bbc/origin}:/srv/origin:ro
      - caddy_data:/data
      - caddy_config:/config
    # Only what the Caddyfile reads ({$…}), not all of production.env: Caddy holds no secret, and its container changes
    # only when one of these does (deploy.sh step 8 then recreates it; otherwise it reloads the Caddyfile).
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
      API_DOMAIN_STAGING: ${API_DOMAIN_STAGING:-}
      ORIGIN_TLS: ${ORIGIN_TLS:-off}
    # deliberately NOT depends_on api: a dead upstream is a 502, not a dead Caddy (certs must keep renewing)
    deploy: { resources: { limits: { memory: 128m } } }

  # ── production API ────────────────────────────────────────────────────────
  api:
    image: ${API_IMAGE:?API_IMAGE must be a SHA-tagged image}
    <<: [*restart, *logging]
    networks: [edge, data]
    env_file:
      - path: "${ENV_FILE:-./env/production.env}"
        required: false
    environment:
      PORT: "8000"
      APP_ROLE: api
      DB_POOLER: transaction
      DATABASE_URL: postgres://bbc:${POSTGRES_PASSWORD}@pgbouncer:5432/bbc
    depends_on:
      postgres: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
    deploy:
      # Two on two cores, staging alongside (docs/perf/CAPACITY.md). deploy.sh reads the same setting.
      replicas: ${API_REPLICAS:-2}
      resources: { limits: { cpus: "1.0", memory: "${API_MEMORY:-512m}" } }

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    <<: [*restart, *logging]
    networks: [data]
    environment:
      DATABASE_URL: postgres://bbc:${POSTGRES_PASSWORD}@postgres:5432/bbc
      DB_USER: bbc
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_NAME: bbc
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      ADMIN_USERS: bbc
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # Named prepared statements across transaction pooling; 1.24 defaults to 200, written here so an image change
      # cannot turn them off without a diff (ADR-IMPL-074).
      MAX_PREPARED_STATEMENTS: "200"
      # A Postgres restart held every request 15 s (server_login_retry's default) before PgBouncer tried again: 1 s.
      # A client waits 10 s at most for a server connection, then gets an error it can show (query_wait_timeout).
      SERVER_LOGIN_RETRY: "1"
      QUERY_WAIT_TIMEOUT: "10"
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "pg_isready", "-h", "127.0.0.1"], interval: 5s, timeout: 3s, retries: 10 }
    deploy: { resources: { limits: { memory: 64m } } }

  worker:
    image: ${API_IMAGE:?API_IMAGE must be a SHA-tagged image}
    <<: [*restart, *logging]
    command: ["bun", "apps/api/src/worker.ts"]
    networks: [edge, data]
    env_file:
      - path: "${ENV_FILE:-./env/production.env}"
        required: false
    environment:
      APP_ROLE: worker
      WORKER_PORT: "8001"
      DB_POOLER: none
      DATABASE_URL: postgres://bbc:${POSTGRES_PASSWORD}@postgres:5432/bbc
      PGBOUNCER_ADMIN_URL: postgres://bbc:${POSTGRES_PASSWORD}@pgbouncer:5432/pgbouncer
    depends_on:
      postgres: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 60s
    deploy: { resources: { limits: { cpus: "1.0", memory: "${WORKER_MEMORY:-512m}" } } }

  postgres:
    build: { context: ./postgres } # postgres:16 + pgbackrest in the SAME container (archive_command needs it)
    image: bbc-postgres:16
    <<: [*restart, *logging]
    networks: [data]
    env_file:
      - path: "${ENV_FILE:-./env/production.env}"
        required: false # so `compose config` works on a checkout that only has *.example; deploy/bootstrap always pass the real 600 file
    environment:
      POSTGRES_USER: bbc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # pg_dump, psql and pgBackRest run inside this container over the local socket, which asks for a password
      # (--auth-local=scram-sha-256). The same secret as POSTGRES_PASSWORD — nothing new is exposed.
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bbc
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      PGBACKREST_STANZA: bbc
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      # auto_explain (ADR-IMPL-077): loaded but off here (no auto_explain.log_min_duration: -1), and never switched on:
      # a custom plan can carry a statement's bound values as text (an email, a token). A tuning reads the generic plan
      # of pg_stat_statements' text instead (RUNBOOK § Tuning a statement); staging, with test data, keeps 500 ms. Its
      # own bound-values setting stays 0 either way (log_parameter_max_length below does not reach it).
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - auto_explain.log_parameter_max_length=0
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      # Planning counted too (ADR-IMPL-073): plans per call show on Grafana whether statements are prepared once.
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=bbc archive-push %p
      - -c
      - archive_timeout=300
      # ADR-IMPL-077, while the queries are tuned: statements over 250 ms in the log, without their bound parameters
      # (they carry emails and session tokens: the statement and its plan say enough); I/O timed per statement (cheap on
      # Linux's clock); no JIT — it compiles on exactly the long statements (a year of job runs sorted) and adds to them.
      - -c
      - log_min_duration_statement=250
      - -c
      - log_parameter_max_length=0
      # An error's DETAIL names the row it met (`Key (email)=(…) already exists`): terse keeps the error and its
      # statement, without the values.
      - -c
      - log_error_verbosity=terse
      - -c
      - track_io_timing=on
      - -c
      - jit=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pgbackrest_spool:/var/spool/pgbackrest
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bbc -d bbc"], interval: 5s, timeout: 3s, retries: 10 }
    # Time for the shutdown checkpoint and the last WAL push, rather than a SIGKILL and crash recovery after 10 s.
    stop_grace_period: 60s
    # The OOM killer takes everything else first: losing Postgres mid-write is the one failure that costs data.
    oom_score_adj: -500
    deploy: { resources: { limits: { cpus: "2.0", memory: "${POSTGRES_MEMORY:-2g}" } } }

  cron:
    image: alpine:3.20 # busybox crond + wget, verified present
    <<: [*restart, *logging]
    networks: [edge]
    entrypoint: ["/bin/sh", "/etc/cron/run.sh"]
    volumes: ["./cron:/etc/cron:ro"]
    environment:
      API_URL: "http://worker:8001"
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET}"
    depends_on: { worker: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 64m } } }

  minio:
    # MinIO stopped publishing its community image on 23 Oct 2025 (minio/minio is gone from Docker Hub).
    # Chainguard's build of the same server, pinned by digest — bump it with infra/RUNBOOK.md, "Images pinned by digest".
    image: cgr.dev/chainguard/minio:latest@sha256:9dcc028b309030afa86fc1fc8d93907ae373ea3fb75277cca3fc77e4645932b7
    # Off until R1b serves offer photography from it (ADR-IMPL-073): nothing reads it before then (ADR-IMPL-047), and its
    # 256 MB pay for the monitoring. MEDIA=on in production.env: bootstrap.sh starts it; deploy.sh never starts it, so on a
    # running box `docker compose ... --profile media up -d minio`.
    profiles: ["media"]
    <<: [*restart, *logging]
    networks: [data]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
    volumes: ["minio_data:/data"]
    deploy: { resources: { limits: { memory: 256m } } }

  # App Redis. Private, unpublished. The API uses it only when REDIS_URL is set (ADR-IMPL-029).
  # GlitchTip's `redis` below is a different service — do not point the API there.
  redis-app:
    image: redis:8.10.1-alpine
    profiles: ["redis-kafka"]
    <<: [*restart, *logging]
    networks: [data]
    environment:
      REDIS_APP_PASSWORD: "${REDIS_APP_PASSWORD:-}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'if [ -z "$$REDIS_APP_PASSWORD" ]; then echo "REDIS_APP_PASSWORD is required" >&2; exit 1; fi; exec redis-server --requirepass "$$REDIS_APP_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no'
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_APP_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 320m } } }

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["redis-kafka"]
    <<: [*restart, *logging]
    networks: [data]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    deploy: { resources: { limits: { memory: 1g } } }

  kafka-init:
    image: apache/kafka:4.3.1
    profiles: ["redis-kafka"]
    networks: [data]
    depends_on: { kafka: { condition: service_healthy } }
    restart: "no"
    entrypoint: ["/bin/sh", "/init/topics.sh"]
    volumes: ["./kafka:/init:ro"]
    deploy: { resources: { limits: { memory: 512m } } }

  # ── GlitchTip: only with GLITCHTIP=on in production.env (bootstrap.sh and deploy.sh add the profile) ─────
  redis:
    image: redis:7-alpine
    profiles: ["glitchtip"]
    <<: [*restart, *logging]
    networks: [data]
    # ONLY for GlitchTip. Our rate limiting stays in Postgres (fail-closed). Do not point the API here.
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    deploy: { resources: { limits: { memory: 256m } } }

  glitchtip-postgres:
    image: postgres:16-alpine
    profiles: ["glitchtip"]
    <<: [*restart, *logging]
    networks: [data]
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}
      POSTGRES_DB: glitchtip
    volumes: [glitchtip_pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"], interval: 5s, timeout: 3s, retries: 10 }
    deploy: { resources: { limits: { memory: 512m } } }

  glitchtip:
    image: glitchtip/glitchtip:latest
    profiles: ["glitchtip"]
    <<: [*restart, *logging]
    networks: [data]
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-}@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      GLITCHTIP_DOMAIN: https://${ERRORS_DOMAIN:-}
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "30"
      ENABLE_USER_REGISTRATION: "false"
    depends_on: { glitchtip-postgres: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 512m } } }

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    profiles: ["glitchtip"]
    <<: [*restart, *logging]
    networks: [data]
    command: ["./bin/run-celery-with-beat.sh"]
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-}@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET:-}
      REDIS_URL: redis://redis:6379/0
    depends_on: [glitchtip]
    deploy: { resources: { limits: { memory: 384m } } }

  uptime-kuma:
    image: louislam/uptime-kuma:1
    <<: [*restart, *logging]
    networks: [data, edge] # needs edge to probe the API; reachable by humans only via SSH tunnel
    volumes: ["kuma_data:/app/data"]
    deploy: { resources: { limits: { memory: 128m } } }

  # ── monitoring: only with MONITORING=on in production.env (bootstrap.sh and deploy.sh add the profile) ─────
  # Metrics only (ADR-IMPL-073): VictoriaMetrics scrapes every replica, the worker, the host and the containers each 30 s
  # and keeps 90 days; Grafana shows them and sends five alerts to GRAFANA_ALERTS_WEBHOOK. Logs and traces wait for
  # staging's own machine. Nothing here is published but Grafana, on the box's loopback only: an SSH tunnel reaches it.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    profiles: ["monitoring"]
    <<: [*restart, *logging]
    networks: [data] # the replicas, the worker and the exporters are all on it; no internet
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -promscrape.configCheckInterval=1m
      - -selfScrapeInterval=30s
      - -memory.allowedPercent=40
    volumes:
      - vm_data:/storage
      - ./monitoring/victoriametrics:/etc/victoriametrics:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy: { resources: { limits: { cpus: "0.5", memory: 192m } } }

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    <<: [*restart, *logging]
    networks: [data, edge] # edge for the alerts' webhook, which is outside the box; data for VictoriaMetrics
    # Loopback only: `ssh -L 3000:127.0.0.1:3000 root@<host>`, then http://localhost:3000 (RUNBOOK § Monitoring).
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Grafana 13 ships its data sources as plugins, each backend its own process inside this limit: only Prometheus's
      # (VictoriaMetrics speaks it) is loaded. The expressions the alerts use are part of Grafana itself.
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,tempo,zipkin,opentsdb,stackdriver,mssql,jaeger,loki,mysql,influxdb,grafana-pyroscope-datasource
      # The contact point reads it (provisioning/alerting/alerts.yml). A name of its own, not OPS_WEBHOOK: staging.env may
      # set that one for staging, and guard_staging refuses in staging.env every name this file substitutes.
      GRAFANA_ALERTS_WEBHOOK: ${GRAFANA_ALERTS_WEBHOOK:-}
      # The database dashboard reads Postgres as bbc_monitor (pg_monitor, ADR-IMPL-077); deploy.sh gives the role this.
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: { victoriametrics: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy: { resources: { limits: { cpus: "0.5", memory: 384m } } }

  # The host: CPU (steal included), memory, disk. Its network figures are its container's own; cAdvisor has each
  # container's.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    profiles: ["monitoring"]
    <<: [*restart, *logging]
    networks: [data]
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.diskstats
      - --collector.pressure
      - --collector.stat
    volumes: ["/:/host:ro,rslave"]
    deploy: { resources: { limits: { cpus: "0.1", memory: 32m } } }

  # Each container: CPU, memory against its limit, throttling, network. Every 30 s, Docker's containers only, the
  # compose service as its only label: on two cores its own CPU is watched on its dashboard (RUNBOOK § Monitoring).
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    profiles: ["monitoring"]
    <<: [*restart, *logging]
    networks: [data]
    privileged: true
    devices: ["/dev/kmsg"]
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --enable_metrics=cpu,memory,network,oom_event
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy: { resources: { limits: { cpus: "0.2", memory: 128m } } }

volumes:
  postgres_data: {}
  pgbackrest_spool: {}
  glitchtip_pg: {}
  minio_data: {}
  kuma_data: {}
  caddy_data: {}
  caddy_config: {}
  kafka_data: {}
  vm_data: {}
  grafana_data: {}
