# deploy.sh adds this file only when the previous staging image has no apps/api/src/worker.ts.
services:
  api-staging:
    environment:
      DB_POOLER: none
      DATABASE_URL: postgres://bbc:${POSTGRES_PASSWORD_STAGING}@postgres-staging:5432/bbc
  cron-staging:
    environment:
      API_URL: http://api-staging:8000
