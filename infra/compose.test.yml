name: bbc-test
services:
  postgres-test:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: bbc, POSTGRES_PASSWORD: bbc, POSTGRES_DB: bbc_test }
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
        "-c",
        "max_connections=200",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.max=10000",
        "-c",
        "pg_stat_statements.track=all",
      ]
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bbc -d bbc_test"], interval: 2s, timeout: 2s, retries: 15 }

  pgbouncer-test:
    image: edoburu/pgbouncer:v1.24.1-p0
    environment:
      DATABASE_URL: postgres://bbc:bbc@postgres-test:5432/bbc_test
      DB_USER: bbc
      DB_PASSWORD: bbc
      DB_HOST: postgres-test
      DB_NAME: bbc_test
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      ADMIN_USERS: bbc
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports: ["55433:5432"]
    depends_on: { postgres-test: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "pg_isready", "-h", "127.0.0.1"], interval: 2s, timeout: 2s, retries: 15 }
