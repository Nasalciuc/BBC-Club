name: bbc-test
services:
  postgres-test:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: bbc, POSTGRES_PASSWORD: bbc, POSTGRES_DB: bbc_test }
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
        "-c",
        "max_connections=50",
      ]
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bbc -d bbc_test"], interval: 2s, timeout: 2s, retries: 15 }
