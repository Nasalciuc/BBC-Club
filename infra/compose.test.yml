name: bbc-test
services:
  postgres-test:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: bbc, POSTGRES_PASSWORD: bbc, POSTGRES_DB: bbc_test }
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
        "-c",
        "max_connections=200",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.max=10000",
        "-c",
        "pg_stat_statements.track=all",
      ]
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bbc -d bbc_test"], interval: 2s, timeout: 2s, retries: 15 }

  pgbouncer-test:
    image: edoburu/pgbouncer:v1.24.1-p0
    environment:
      DATABASE_URL: postgres://bbc:bbc@postgres-test:5432/bbc_test
      DB_USER: bbc
      DB_PASSWORD: bbc
      DB_HOST: postgres-test
      DB_NAME: bbc_test
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      ADMIN_USERS: bbc
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      RESERVE_POOL_SIZE: "5"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports: ["55433:5432"]
    depends_on: { postgres-test: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "pg_isready", "-h", "127.0.0.1"], interval: 2s, timeout: 2s, retries: 15 }

  # Opt-in. The API suite does not set REDIS_URL or KAFKA_BROKERS, so these stay unused until a test does.
  redis-test:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["56379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 15 }

  kafka-test:
    image: apache/kafka:4.3.1
    ports: ["55434:9094"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-test:9092,EXTERNAL://127.0.0.1:55434"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-test:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 25s
