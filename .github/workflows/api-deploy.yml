# Live workflow — GitHub only loads .github/workflows/ at the repository root.
# Snapshot copy: isolated/infra-production-v2/infra-v2/.github/workflows/api-deploy.yml
name: api-deploy
on:
  push:
    branches: [main]
    # After the monorepo assembly these become infra/**, apps/api/**, packages/**.
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/api-deploy.yml"
      - "isolated/infra-production-v2/infra-v2/**"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "staging | production"
        required: true
        default: "staging"

permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          SHA=${GITHUB_SHA::7}
          echo "image=ghcr.io/nasalciuc/bbc-api:${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # Post-assembly path: apps/api/Dockerfile
          file: isolated/infra-production-v2/infra-v2/apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/nasalciuc/bbc-api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # After the assembly this is simply: bash ${APP_DIR}/infra/deploy.sh (APP_DIR defaults to /opt/bbc)
          script: bash "$(find /opt/bbc -maxdepth 5 -type f -name deploy.sh -path '*/infra/deploy.sh' | head -1)" staging ${{ needs.build.outputs.image }}

  production:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: production            # protected: requires manual approval in GitHub → Environments
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bbc && git fetch -q && git checkout -q ${{ github.sha }}
            bash "$(find /opt/bbc -maxdepth 5 -type f -name deploy.sh -path '*/infra/deploy.sh' | head -1)" production ${{ needs.build.outputs.image }}
