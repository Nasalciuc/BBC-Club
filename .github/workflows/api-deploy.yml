# Main deploys itself (ADR-IMPL-079): a green `validate` on a push to main builds that commit's API image (7-char SHA
# tag only, GHCR), deploys it to staging over SSH (infra/deploy.sh), then publishes the preview app's update — or starts
# the preview build a native change needs — and deploys production once Scaler approves it (GitHub → Environments →
# production). Every job uses the commit `gate` names: the one validate checked, never main's tip at the time.
# workflow_dispatch runs one target by hand, with the preview step (`ota`), only its report (`dry_run`), or a publish
# the unchanged app would skip (`force`: after an EAS preview variable changed).
name: api-deploy
on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging | production"
        required: true
        default: staging
      ota:
        description: "After staging: publish the preview update, or start the preview build a native change needs"
        type: boolean
        default: false
      dry_run:
        description: "Preview step only says what it would publish or build (needs ota)"
        type: boolean
        default: false
      force:
        description: "Preview step publishes even if the app is unchanged: after an EAS preview variable changed (needs ota)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    # A validate run that passed on a push to main, or a run by hand. Nothing else goes on.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      current: ${{ steps.sha.outputs.current }}
    steps:
      - id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # At workflow_run, github.sha is main's tip now, not the commit validate checked: the run's head_sha is.
          if [ "$EVENT" = "workflow_run" ]; then sha="$VALIDATED_SHA"; else sha="$DISPATCHED_SHA"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$EVENT" = "workflow_run" ] && [ "$main" != "$sha" ]; then
            # A newer commit is on main: its own run deploys it, and this one stops before building anything.
            echo "current=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Superseded"
              echo "main is at \`${main::7}\`, past \`${sha::7}\`: the newer commit's run deploys."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: echo "image=ghcr.io/nasalciuc/bbc-api:${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: [gate, build]
    if: >-
      needs.gate.outputs.current == 'true' &&
      (github.event_name == 'workflow_run' || inputs.target == 'staging')
    runs-on: ubuntu-24.04
    environment: staging
    # Concurrency per job, never per workflow: see production.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # The action's default is 10 minutes, then it ends the session and deploy.sh with it: a production deploy
          # waits 10 minutes on its canary alone. An hour: up to 25 minutes for the lock, then the deploy.
          command_timeout: 60m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/bbc}"
            cd "$APP_DIR"
            # One deploy at a time on the box, whichever ref or environment: the checkout below is shared.
            exec 9>/var/lock/bbc-deploy.lock
            flock -w 1500 9 || { echo "❌ another deploy has held the box for 25 minutes"; exit 1; }
            git fetch -q --all
            # A merge's staging deploys main's tip and nothing older: a build that finished after a newer merge's would
            # otherwise put the older API back on staging last. A run by hand deploys the ref it names.
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              main=$(git rev-parse origin/main)
              [ "$main" = "${{ needs.gate.outputs.sha }}" ] ||
                { echo "❌ main is at ${main::7}, past this commit, while it built: the newer commit's run deploys staging"; exit 1; }
            fi
            # Production's Caddy reads infra/caddy from this checkout (its well-known files at once), and the monitoring
            # infra/monitoring (its scrape targets and dashboards within a minute): staging takes main's (ADR-IMPL-073).
            git diff --quiet origin/main ${{ needs.gate.outputs.sha }} -- infra/caddy infra/monitoring ||
              { echo "❌ this commit's infra/caddy or infra/monitoring is not main's, and production reads them from this checkout: deploy it to staging after the merge"; exit 1; }
            git checkout -q ${{ needs.gate.outputs.sha }}
            bash "$(find "$APP_DIR" -maxdepth 5 -type f -path '*/infra/deploy.sh' | head -1)" staging ${{ needs.build.outputs.image }}

  ota-preview:
    # After staging, so the update never calls an endpoint staging does not have yet; not behind production's approval.
    needs: [gate, staging]
    if: >-
      needs.gate.outputs.current == 'true' && needs.staging.result == 'success' &&
      (github.event_name == 'workflow_run' || inputs.ota)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ota-preview
      cancel-in-progress: false
    # EXPO_TOKEN only in the two steps that call EAS, as in release.yml: never in `bun install` or the runtime step.
    env:
      # One eas-cli for every workflow (release.yml too), run with bunx at this version: kept out of the workspace,
      # whose Expo tooling it would otherwise re-resolve (ADR-IMPL-079).
      EAS_CLI_VERSION: "26.0.0"
      SHA: ${{ needs.gate.outputs.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.3.4" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.14.0" }
      - run: bun install --frozen-lockfile

      - name: Anything to publish
        id: changes
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas() { bunx "eas-cli@$EAS_CLI_VERSION" "$@"; }
          # A run by hand with `force`: a variable of the EAS preview environment changed (the API's address, the
          # phone), which no diff of the repository shows, and the bundle that carries it is published again.
          if [ "$FORCE" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "last=n/a" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Against the commit of the last update published on the preview branch, not this commit's parent: a run
          # superseded at the gate published nothing, and its changes must still reach the phones.
          # A failed lookup is said, then read as "no update known", as before the first one: the step below decides.
          if list=$(eas update:list --branch preview --limit 1 --json --non-interactive); then
            group=$(jq -r '.currentPage[0].group // empty' <<<"$list")
          else
            echo "::warning::eas update:list failed: the last preview update is unknown, so the app counts as changed and the publish check continues"
            group=""
          fi
          last=""
          if [ -n "$group" ]; then
            last=$(eas update:view "$group" --json | jq -r '[.[].gitCommitHash // empty][0] // empty')
          fi
          # From the repository's root: the paths are the app's and what it bundles.
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null &&
            git -C "$GITHUB_WORKSPACE" diff --quiet "$last" "$SHA" -- apps/mobile packages/ui packages/shared package.json bun.lock; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### Preview app" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing to publish: the app has not changed since the last preview update (\`${last::7}\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "last=${last:-none}" >> "$GITHUB_OUTPUT"
          fi

      - name: Runtime of this commit
        id: runtime
        if: steps.changes.outputs.publish == 'true'
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # The fingerprint EAS Build computes for the preview build of this commit: the Firebase file it hands the
          # build is left out of the hash (fingerprint.config.js), and the EXPO_PUBLIC_* values do not enter it.
          rv=$(npx expo-updates runtimeversion:resolve --platform android | jq -r '.runtimeVersion // empty')
          [ -n "$rv" ] || { echo "❌ no runtime version resolved"; exit 1; }
          echo "version=$rv" >> "$GITHUB_OUTPUT"

      - name: Publish the update, or start the build a native change needs
        if: steps.changes.outputs.publish == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUNTIME: ${{ steps.runtime.outputs.version }}
          LAST: ${{ steps.changes.outputs.last }}
        run: |
          set -euo pipefail
          eas() { bunx "eas-cli@$EAS_CLI_VERSION" "$@"; }
          # Right before each EAS side effect: the gate saw this commit at main's tip, but the job may start after a
          # newer merge's preview step has published, and would then publish the older app over it. A run by hand
          # publishes the ref it names.
          still_main() {
            [ "$GITHUB_EVENT_NAME" = "workflow_run" ] || return 0
            main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            [ "$main" = "$SHA" ] && return 0
            echo "- superseded: main is at \`${main::7}\`, past \`${SHA::7}\`; the newer commit's run brings the preview app up to date" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          title=$(git log -1 --format=%s "$SHA")
          builds=$(eas build:list --platform android --build-profile preview --runtime-version "$RUNTIME" --limit 10 --json --non-interactive)
          finished=$(jq '[.[] | select(.status == "FINISHED")] | length' <<<"$builds")
          pending=$(jq -r '[.[] | select(.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS")][0].id // empty' <<<"$builds")
          {
            echo "### Preview app"
            echo "- commit: \`${SHA::7}\` $title (last published: \`${LAST::7}\`)"
            echo "- runtime: \`$RUNTIME\`"
            echo "- iOS: no Apple Developer account yet"
            [ "$FORCE" != "true" ] || echo "- forced by hand: the unchanged-app check was skipped"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$finished" -gt 0 ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "- dry run: a preview build has this runtime; it would publish \`${SHA::7} $title\` to channel preview" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            still_main
            # The bundle is the preview build's: EXPO_PUBLIC_APP_ENV as eas.json's preview profile sets it, and the rest
            # from the EAS preview environment. eas-cli reads app.config.ts with this shell's env before it loads that
            # environment, and assertStagingEnv refuses a staging config without its API: so the update runs inside
            # the environment (env:exec, its own sh), and the message goes in by name, never into the command's text.
            export UPDATE_MESSAGE="${SHA::7} $title"
            eas env:exec preview 'EXPO_PUBLIC_APP_ENV=staging bunx "eas-cli@$EAS_CLI_VERSION" update --channel preview --environment preview --platform android --message "$UPDATE_MESSAGE" --non-interactive' --non-interactive
            echo "- published to channel preview: open the app, close it, and open it again" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$pending" ]; then
            # It may carry an earlier commit's JavaScript: nothing is published now, and the next merge (or a run by
            # hand with ota) publishes onto it once it has finished — the diff above runs from the last update.
            echo "- build \`$pending\` for this runtime is queued or running: nothing published now; the next merge, or a run by hand with ota, publishes onto it once it has finished" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$DRY_RUN" = "true" ]; then
              echo "- dry run: no preview build has this runtime; it would start one (eas build --profile preview)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            still_main
            # Inside the preview environment too, for the same first config read; its JSON goes to a file, so nothing
            # env:exec prints can reach jq.
            export BUILD_JSON="$RUNNER_TEMP/preview-build.json"
            eas env:exec preview 'bunx "eas-cli@$EAS_CLI_VERSION" build --profile preview --platform android --non-interactive --no-wait --json > "$BUILD_JSON"' --non-interactive
            url=$(jq -r '.[0] | "https://expo.dev/accounts/\(.app.ownerAccount.name)/projects/\(.app.slug)/builds/\(.id)"' "$BUILD_JSON")
            echo "- something native changed: a new preview build, $url — testers install the new APK once (the build carries this commit's JavaScript, so no update is published)" >> "$GITHUB_STEP_SUMMARY"
          fi

  production:
    # Not after ota-preview: the preview app calls staging, never production, and an EAS outage or a 45-minute
    # preview build must not hold an API release (ADR-IMPL-079).
    needs: [gate, build, staging]
    # !cancelled(): a run by hand for production skips staging, which would otherwise skip this job with it.
    if: >-
      !cancelled() && needs.gate.outputs.current == 'true' && needs.build.result == 'success' &&
      ((github.event_name == 'workflow_run' && needs.staging.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-24.04
    environment: production # protected: requires manual approval in GitHub → Environments
    # Concurrency per job, never per workflow: a production deploy waiting for its approval keeps the run open, and a
    # workflow-level group would hold every later merge's staging deploy behind it. An older run still waiting when a
    # newer one arrives is rejected in Environments, and only the newest is approved (ADR-IMPL-079); one approved
    # anyway stops on the box, before its checkout, once main has moved past it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # The action's default is 10 minutes, then it ends the session and deploy.sh with it: a production deploy
          # waits 10 minutes on its canary alone. An hour: up to 25 minutes for the lock, then the deploy.
          command_timeout: 60m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/bbc}"
            cd "$APP_DIR"
            # One deploy at a time on the box, whichever ref or environment: the checkout below is shared.
            exec 9>/var/lock/bbc-deploy.lock
            flock -w 1500 9 || { echo "❌ another deploy has held the box for 25 minutes"; exit 1; }
            git fetch -q --all
            # Production deploys main's tip and nothing older: an approval that waited past a newer merge would put
            # back the older API and, from this checkout, the older infra/caddy and infra/monitoring production reads.
            main=$(git rev-parse origin/main)
            [ "$main" = "${{ needs.gate.outputs.sha }}" ] ||
              { echo "❌ main is at ${main::7}, past this commit: approve the newest production deploy instead"; exit 1; }
            git checkout -q ${{ needs.gate.outputs.sha }}
            bash "$(find "$APP_DIR" -maxdepth 5 -type f -path '*/infra/deploy.sh' | head -1)" production ${{ needs.build.outputs.image }}
