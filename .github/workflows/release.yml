name: release
# Production EAS build. Never triggered from a pull request.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: android until an Apple Developer account exists
        type: choice
        options: [android, ios]
        default: android
      submit:
        description: Submit this run's Android production build to the internal draft track
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: iOS is not ready
        if: ${{ inputs.platform == 'ios' }}
        run: |
          echo "No Apple Developer account yet. Do not restore submit.production.ios until the team and ASC ids exist. See docs/release.md."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require a green e2e-android run on this exact commit
        run: |
          set -euo pipefail
          green=$(gh run list --workflow e2e-android --commit "$GITHUB_SHA" --json conclusion \
            --jq '[.[] | select(.conclusion=="success")] | length')
          if [ "$green" -gt 0 ]; then
            echo "e2e-android already succeeded on $GITHUB_SHA"
            exit 0
          fi
          echo "No successful e2e-android run on $GITHUB_SHA — dispatching on main"
          old=$(gh run list --workflow e2e-android --branch main --event workflow_dispatch --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          gh workflow run e2e-android --ref main
          run_id=""
          for _ in $(seq 1 36); do
            now=$(gh run list --workflow e2e-android --branch main --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$now" ] && [ "$now" != "$old" ]; then
              run_id=$now
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Timed out waiting for the dispatched e2e-android run"
            exit 1
          fi
          gh run watch "$run_id" --exit-status
          head=$(gh run view "$run_id" --json headSha --jq .headSha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main moved: e2e ran on $head, this release is $GITHUB_SHA"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.3.4" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.14.0" }

      - run: bun install --frozen-lockfile

      - name: EAS production build
        id: build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          out=$(bunx eas-cli build --profile production --platform "${{ inputs.platform }}" --non-interactive --json --wait)
          id=$(printf '%s' "$out" | jq -r '.[0].id // empty')
          status=$(printf '%s' "$out" | jq -r '.[0].status // empty' | tr '[:upper:]' '[:lower:]')
          if [ -z "$id" ] || [ "$status" != "finished" ]; then
            echo "EAS build did not finish: id=${id:-none} status=${status:-none}"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Submit Android internal draft
        if: ${{ inputs.submit }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bunx eas-cli submit --profile production --platform android --id "${{ steps.build.outputs.id }}" --non-interactive
