name: bench
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://bbc:bbc@localhost:55432/bbc_test
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0000
      INTERNAL_API_SECRET: ci-internal-ci-internal-ci-internal-0
      APP_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.3.4" }

      - name: Start test Postgres
        run: |
          docker compose -f infra/compose.test.yml down --remove-orphans || true
          docker compose -f infra/compose.test.yml up -d --wait

      - run: bun install --frozen-lockfile
      - run: bun run --filter @bbc/db db:migrate
      - run: bun run --filter @bbc/db db:seed -- --bench
      - run: bun run load/bench/run.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-report
          path: load/bench/report.json
