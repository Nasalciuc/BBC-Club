name: validate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bbc, POSTGRES_PASSWORD: bbc, POSTGRES_DB: bbc_test }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U bbc -d bbc_test" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgres://bbc:bbc@localhost:55432/bbc_test
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0000
      INTERNAL_API_SECRET: ci-internal-ci-internal-ci-internal-0
      APP_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.3.4" }

      - run: bun install --frozen-lockfile
      # Official binary — npm `gitleaks` / bunx stubs have no usable CLI.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --no-banner --redact

      - run: bun run format
      - run: bun run lint
      - run: bun run arch:check
      - run: bun run typecheck
      - run: bun run tokens:check
      - run: bun run design:lint

      - run: bun run --filter @bbc/db db:migrate
      - run: bun run test:unit
      - run: bunx turbo run test:db
      - run: bun run db:verify

      # Last: five it.todo contract tests keep this red by design (ASSEMBLY_REPORT).
      - run: bun run module:check
