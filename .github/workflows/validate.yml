name: validate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bbc, POSTGRES_PASSWORD: bbc, POSTGRES_DB: bbc_test }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U bbc -d bbc_test" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgres://bbc:bbc@localhost:55432/bbc_test
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0000
      INTERNAL_API_SECRET: ci-internal-ci-internal-ci-internal-0
      APP_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.3.4" }
      - run: bun install --frozen-lockfile
      - run: bunx gitleaks detect --no-banner --redact
      - run: bun run validate:quick
      - run: bun run --filter @bbc/db db:migrate
      - run: bun run test:unit
      - run: turbo run test:db
      - run: bun run db:verify
      - name: architecture graph (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          sudo apt-get install -y graphviz
          bun run arch:graph
          git config user.name bbc-bot && git config user.email bot@buybusinessclass.com
          git add docs/architecture/modules.svg && git diff --cached --quiet || git commit -m "docs(arch): regenerate module graph [skip ci]" && git push
