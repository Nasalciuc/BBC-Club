name: validate
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://bbc:bbc@localhost:55432/bbc_test
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0000
      INTERNAL_API_SECRET: ci-internal-ci-internal-ci-internal-0
      APP_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        # origin/main for check-destructive-migrations (it reads only migrations new or changed on this branch)
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.3.4" }

      # The company's price rules too (ADR-IMPL-037): a force-added pricing-rules.json fails here.
      - name: Refuse tracked store secrets
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- 'google-play-service-account.json' '*.p8' '*.p12' '*.mobileprovision' '*service-account*.json' '*pricing-rules*.json')
          if [ -n "$tracked" ]; then
            echo "These secret files are tracked and must not be:"
            echo "$tracked"
            exit 1
          fi

      - name: Start test Postgres
        run: |
          docker compose -f infra/compose.test.yml down --remove-orphans || true
          docker compose -f infra/compose.test.yml up -d --wait

      - run: bun install --frozen-lockfile
      # Every package.json and bun.lock agree. --frozen-lockfile let a workspace dependency added without a lockfile
      # update pass (#55); regenerating the lockfile and diffing catches it.
      - name: Lockfile in sync with every package.json
        run: bun install --lockfile-only && git diff --exit-code -- bun.lock
      - run: bun test scripts/env-profile.test.ts
      # Official binary — npm `gitleaks` / bunx stubs have no usable CLI.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --no-banner --redact

      - run: bun run privacy-manifest:check
      - run: bun run format
      - run: bun run lint
      - run: bun run arch:check
      - run: bun run typecheck
      - run: bun run tokens:check
      - run: bun run design:lint
      # Ratchet: column names written as text in raw SQL may only go down (scripts/raw-sql-columns.baseline.json).
      - run: bun run sql:columns
      # New or changed migrations: DROP / TRUNCATE / ALTER … TYPE / DELETE without WHERE need `-- destructive: <reason>`.
      - run: bun run migrations:destructive
      # The drizzle snapshot matches the schema: generate must propose nothing. A drifted snapshot once made generate
      # emit a migration that recreated existing objects and would have failed on every existing database.
      - name: Drizzle snapshot matches the schema
        run: |
          # stdin closed and a time limit: an interactive question (a rename?) fails fast instead of hanging the job.
          (cd packages/db && timeout 120 bun run db:generate < /dev/null)
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            git status --porcelain -- packages/db/migrations
            echo "drizzle-kit generate produced a migration: commit it, or (if the objects come from a named step) a no-op sync like 20261008214247_snapshot_sync (SELECT 1 + the updated snapshot.json)"
            exit 1
          fi

      - run: bun run --filter @bbc/db db:migrate
      - run: bun run test:unit
      # ADR-IMPL-037: the company's price rules are a secret, never in the repository. With them, the engine must
      # reproduce the reference results (compared by hash; nothing prints a price). Not via turbo, whose strict env mode
      # would drop the secret. A fork's pull request gets no secrets, so it skips this step.
      - name: Price formula parity (rules from the PRICING_RULES_JSON secret)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: packages/modules/domain/catalog
        env:
          PRICING_RULES_JSON: ${{ secrets.PRICING_RULES_JSON }}
          PRICING_PARITY_REQUIRED: "1"
        run: bun test tests/parity
      - run: bunx turbo run test:db
      # Bun's zones against Postgres's, two years of every catalogue zone (ADR-IMPL-077): ~50 s of one core, so on its
      # own, after the suites whose tests time the clock.
      - run: bun run test:tz
      - run: bun run db:verify
      - name: Graph shape (G9-G11)
        run: python3 scripts/graph-shape.py

      # Last: five it.todo contract tests keep this red by design (ASSEMBLY_REPORT).
      - run: bun run module:check
      # Static Maestro testID check only. Emulator E2E stays local until APK + API are
      # wired (macos-latest is ARM and cannot boot x86_64 AVD; nested virt unsupported).
      - run: bun run maestro:ids
      - name: Caddyfile
        # Each way the box can run it: ORIGIN_TLS off and on, each with origin-pulls.caddy as committed and with the
        # client_auth block from origin-pulls.caddy.example filled in (the follow-up PR, RUNBOOK). "on" loads a
        # throwaway certificate made here, where the box mounts the real one (/srv/origin).
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/origin" "$work/pulls"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 -subj "/CN=ci.example.com" \
            -addext "subjectAltName=DNS:api.example.com,DNS:api-staging.example.com" \
            -keyout "$work/origin/key.pem" -out "$work/origin/cert.pem" 2>/dev/null
          cp -r infra/caddy/. "$work/pulls/"
          sed -n 's/^# \{0,1\}//p' infra/caddy/origin-pulls.caddy.example | sed -n '/^client_auth {/,/^}/p' > "$work/pulls/origin-pulls.caddy"
          grep -q "mode require_and_verify" "$work/pulls/origin-pulls.caddy"
          check() { # $1: the directory Caddy sees as /etc/caddy · $2: ORIGIN_TLS
            echo "▶ $1 · ORIGIN_TLS=$2"
            docker run --rm \
              -e ACME_EMAIL=ops@example.com \
              -e API_DOMAIN=api.example.com \
              -e API_DOMAIN_STAGING=api-staging.example.com \
              -e ORIGIN_TLS="$2" \
              -v "$1:/etc/caddy:ro" \
              -v "$work/origin:/srv/origin:ro" \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          }
          for tls in off on; do
            check "$PWD/infra/caddy" "$tls"
            check "$work/pulls" "$tls"
          done

  # A job of its own beside validate, whose 15 minutes are spoken for (ADR-IMPL-073).
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - name: Monitoring stack
        # The profile ADR-IMPL-073 adds, the way the box runs it: Compose reads it with every overlay; VictoriaMetrics
        # checks its scrape file (-dryRun), then runs with the compose file's flags; Grafana starts beside it with the
        # compose file's image, environment and memory limit and the repository's provisioning, reaches it, and holds its
        # datasources, the three dashboards, the contact point and the seven alert rules — no provisioning or plugin error in
        # its log, no kill for memory; every alert rule's query returns a result on hand-written sample points. Nothing
        # here reaches the box.
        run: |
          set -euo pipefail
          export API_IMAGE=ci/api:0000000 API_IMAGE_STAGING=ci/api:0000000
          # The box's comes from production.env; Compose substitutes this one into both containers' environments.
          export VM_PASSWORD=ci-vm-password GRAFANA_SECRET_KEY=ci-grafana-secret-key-0000000000000000
          compose="docker compose -f infra/docker-compose.yml -f infra/compose.prod.yml -f infra/compose.staging.yml"
          $compose --profile monitoring --profile media config -q
          $compose --profile monitoring config --format json > "$RUNNER_TEMP/compose.json"
          # The images the box would pull: a tag that does not exist fails here, not on the box.
          $compose --profile monitoring pull -q victoriametrics grafana node-exporter cadvisor
          svc() { jq -r ".services[\"$1\"]$2" "$RUNNER_TEMP/compose.json"; }
          docker run --rm -v "$PWD/infra/monitoring/victoriametrics:/etc/victoriametrics:ro" \
            "$(svc victoriametrics .image)" -promscrape.config=/etc/victoriametrics/scrape.yml -dryRun
          # The two on a network of their own, VictoriaMetrics under the name Grafana's datasource asks for: the alert
          # rules then read no data, as on a quiet box, instead of failing to reach it.
          docker network create monitoring-check >/dev/null
          mapfile -t vm_flags < <(svc victoriametrics '.command[]')
          mapfile -t vm_env < <(svc victoriametrics '.environment | to_entries[] | "--env=\(.key)=\(.value)"')
          docker run -d --name vm-check --network monitoring-check --network-alias victoriametrics -p 127.0.0.1:8428:8428 \
            "${vm_env[@]}" -v "$PWD/infra/monitoring/victoriametrics:/etc/victoriametrics:ro" \
            "$(svc victoriametrics .image)" "${vm_flags[@]}" >/dev/null
          for _ in $(seq 1 30); do docker exec vm-check wget -qO- http://127.0.0.1:8428/health >/dev/null 2>&1 && break; sleep 1; done
          docker exec vm-check wget -qO- http://127.0.0.1:8428/health >/dev/null
          # Basic auth (A-S1): the query API refuses a request without the password and answers one with it.
          if docker exec vm-check wget -qO- 'http://127.0.0.1:8428/api/v1/query?query=1' >/dev/null 2>&1; then
            echo "::error::VictoriaMetrics answered a query without its password"; exit 1
          fi
          docker exec vm-check wget -qO- "http://bbc:${VM_PASSWORD}@127.0.0.1:8428/api/v1/query?query=1" >/dev/null
          # Points typed in by hand (infra/monitoring/ci/sample-metrics.txt) for every name the alert rules read, a minute
          # and two minutes ago (A-Q1): each rule's expression is run against them below, so a query Grafana or
          # VictoriaMetrics refuses, or one that no longer matches the sample's names and labels, fails here. Whether the
          # app and cAdvisor still publish those names is their own tests' (e.g. platform's jobs-flags.test.ts).
          t2=$(( ($(date +%s) - 60) * 1000 )); t1=$(( t2 - 60000 ))
          sed -e "s/__T1__/$t1/" -e "s/__T2__/$t2/" infra/monitoring/ci/sample-metrics.txt > "$RUNNER_TEMP/sample.txt"
          curl -fsS -u "bbc:${VM_PASSWORD}" --data-binary @"$RUNNER_TEMP/sample.txt" http://127.0.0.1:8428/api/v1/import/prometheus
          curl -fsS -u "bbc:${VM_PASSWORD}" http://127.0.0.1:8428/internal/force_flush
          # Grafana's own environment, but for an anonymous admin who reads it here (no password on a command line, none
          # set: the box's comes from production.env) and a webhook that goes nowhere.
          jq -r '.services.grafana.environment | to_entries[]
            | select(.key | test("^(GF_AUTH_ANONYMOUS_ENABLED|GF_SECURITY_ADMIN_PASSWORD|GRAFANA_ALERTS_WEBHOOK)$") | not)
            | "\(.key)=\(.value)"' \
            "$RUNNER_TEMP/compose.json" > "$RUNNER_TEMP/grafana.env"
          docker run -d --name grafana-check --network monitoring-check -p 127.0.0.1:3300:3000 \
            --memory "$(svc grafana .deploy.resources.limits.memory)" --cpus "$(svc grafana .deploy.resources.limits.cpus)" \
            --env-file "$RUNNER_TEMP/grafana.env" \
            -e GF_AUTH_ANONYMOUS_ENABLED=true -e GF_AUTH_ANONYMOUS_ORG_ROLE=Admin \
            -e GRAFANA_ALERTS_WEBHOOK=https://hooks.example.com/ci \
            -v "$PWD/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro" \
            -v "$PWD/infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro" \
            "$(svc grafana .image)" >/dev/null
          api() { curl -fsS "http://127.0.0.1:3300$1"; }
          # Grafana answers /api/health before its provisioning has finished: each check waits up to two minutes.
          wait_for() {
            for _ in $(seq 1 60); do
              [ "$(api "$1" 2>/dev/null | jq -r "$2" 2>/dev/null)" = "$3" ] && return 0
              sleep 2
            done
            echo "::error::Grafana: $1 | $2 is not $3"
            docker logs grafana-check 2>&1 | tail -40
            return 1
          }
          wait_for /api/health .database ok
          wait_for /api/datasources/uid/victoriametrics .uid victoriametrics
          wait_for /api/datasources/uid/victoriametrics/health .status OK
          wait_for /api/datasources/uid/postgres .uid postgres
          wait_for '/api/search?type=dash-db&tag=bbc' length 3
          wait_for /api/v1/provisioning/alert-rules length 7
          wait_for /api/v1/provisioning/contact-points '[.[] | select(.name == "ops")] | length' 1
          # Each rule as Grafana loaded it, its query run against the sample points: a result, or the rule is named.
          api /api/v1/provisioning/alert-rules |
            jq -r '.[] | [.uid, (.data[] | select(.datasourceUid == "victoriametrics") | .model.expr)] | @tsv' |
            while IFS=$'\t' read -r uid expr; do
              out="$(curl -fsS -u "bbc:${VM_PASSWORD}" --data-urlencode "query=${expr}" http://127.0.0.1:8428/api/v1/query)"
              if ! jq -e '.status == "success" and (.data.result | length) > 0' <<<"$out" >/dev/null; then
                echo "::error::alert ${uid} returns nothing on the sample points (infra/monitoring/ci/sample-metrics.txt): ${out}"
                exit 1
              fi
            done
          test "$(docker inspect -f '{{.State.Running}} {{.State.OOMKilled}}' grafana-check)" = "true false"
          if docker logs grafana-check 2>&1 | grep -iE 'level=error.*(provision|plugin)'; then exit 1; fi
          docker rm -f grafana-check vm-check >/dev/null
          docker network rm monitoring-check >/dev/null
