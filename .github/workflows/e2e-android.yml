name: e2e-android
# The four Maestro flows on an Android emulator, against a real API and the test Postgres.
# Nightly on main; on a PR only when the flows, this file or the e2e app config change.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/e2e-android.yml"
      - "apps/mobile/e2e/**"
      - "apps/mobile/app.config.*"
      - "apps/mobile/plugins/**"
concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgres://bbc:bbc@localhost:55432/bbc_test
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0000
      INTERNAL_API_SECRET: ci-internal-ci-internal-ci-internal-0
      APP_ORIGIN: http://localhost:8000
      MAESTRO_VERSION: "2.10.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # First, so a runner without hardware acceleration fails in seconds, not after the APK build.
      - name: KVM on this runner
        run: |
          ls -l /dev/kvm || { echo "::error::no /dev/kvm on this runner — the emulator cannot boot"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.3.4" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.14.0" }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "17" }

      - name: Start test Postgres
        run: |
          docker compose -f infra/compose.test.yml down --remove-orphans || true
          docker compose -f infra/compose.test.yml up -d --wait

      - run: bun install --frozen-lockfile

      - name: Migrate and seed (fixture, flags, the fixture member's password)
        run: |
          bun run --filter @bbc/db db:migrate
          bun run --filter @bbc/db db:seed
          bun run scripts/seed-flags.ts
          bun run scripts/seed-fixture-auth.ts

      # No POSTMARK_SERVER_TOKEN: the console sender keeps the OTP for GET /v1/test/last-otp (not production).
      - name: Start the API
        run: |
          nohup bun apps/api/src/index.ts > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "::error::API did not answer /health in 60 s"
          tail -50 api.log
          exit 1

      - name: Build the e2e APK (cleartext to 10.0.2.2 only, see apps/mobile/app.config.ts)
        working-directory: apps/mobile
        env:
          # Not the job's NODE_ENV=test (the API needs that): babel-preset-expo skips expo-router's
          # EXPO_ROUTER_APP_ROOT transform under test, and the release bundle then fails in _ctx.android.js.
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
          EXPO_PUBLIC_APP_ENV: e2e
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: |
          npx expo prebuild --platform android --no-install
          # The generated gradle.properties caps metaspace at 512m; KSP (:expo-updates:kspReleaseKotlin) runs out.
          # -D overrides it; Kotlin compiles in-process, so no Kotlin daemon keeps memory while the emulator runs.
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Pkotlin.compiler.execution.strategy=in-process

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/mobile/e2e/run-android-ci.sh

      - name: Upload JUnit results and the API log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android-${{ github.run_id }}
          path: |
            e2e-results/
            api.log
          if-no-files-found: warn
